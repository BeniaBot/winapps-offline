  <rect x="8" y="8" width="496" height="496" rx="118" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="118" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- three quiet app tiles -->
  <rect x="102" y="102" width="140" height="140" rx="38" fill="#ffffff" fill-opacity=".13"/>
  <rect x="270" y="102" width="140" height="140" rx="38" fill="#ffffff" fill-opacity=".13"/>
  <rect x="102" y="270" width="140" height="140" rx="38" fill="#ffffff" fill-opacity=".13"/>

  <!-- the statement tile: this store's apps come DOWN, to go anywhere -->
