# Keeps a copy of each in-house app in this project's own release.
#
# Why a copy at all: the site wants to show how many people took a file FROM HERE. GitHub counts
# downloads per release asset, and that number is honest for everything in this repository's
# release, because those files are linked from nowhere else. The in-house apps used to be linked
# straight to their own repositories, where the same counter also totals everyone who took the
# file from the releases page - a real number attached to a false sentence.
#
# Why it is automatic: the other half of the requirement is that the site always offers the newest
# build. A copy made by hand goes stale the first time somebody forgets. So this runs on a
# schedule, and can be kicked off from the Actions tab whenever a release goes out.
#
# It writes mirror.json alongside the copies, so the site can show the version it is actually
# serving rather than the version the source repository has reached.
name: mirror in-house apps

on:
  # sent by each in-house repo the moment it publishes a release
  repository_dispatch:
    types: [inhouse-release]
  # a safety net, for a dispatch that never arrived
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # BEFORE anything is replaced. GitHub's per-asset download counter restarts at zero the
      # moment an asset is clobbered, and this workflow used to read the counters in a later step -
      # after its own upload. So every six hours it reset all six in-house counters and then
      # recorded the zeros it had just created. counts.js banks a total when it sees the number
      # DROP, and the number it compared against was itself a post-reset zero, so nothing was ever
      # banked and every in-house app read 0 for ever. ELIZA.exe: updated 21:20Z, count 0.
      - name: Read the download counters first
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view apps-v1 --repo "$GITHUB_REPOSITORY" --json assets \
            -q "[.assets[] | {name, count: .downloadCount}]" > now.json
          node .github/counts.js now.json counts.json
          rm -f now.json

      - name: Fetch the newest build of each in-house app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p out
          # what the last run mirrored, so a build that has not moved is not re-uploaded. Replacing
          # an asset with a byte-identical copy still resets its download counter, and on a
          # six-hourly schedule that chopped every in-house app's history into four pieces a day
          # and lost whatever landed between the read above and the upload below.
          prev=mirror.json
          [ -f "$prev" ] || prev=/dev/null
          echo '{' > mirror.new
          first=1
          # repo:asset-to-take:name-to-publish-it-under
          while IFS=: read -r repo want as; do
            [ -z "$repo" ] && continue
            rel=$(gh api "repos/$repo/releases/latest" 2>/dev/null || echo '')
            [ -z "$rel" ] && { echo "no release for $repo"; continue; }
            tag=$(echo "$rel" | jq -r '.tag_name')
            url=$(echo "$rel" | jq -r --arg w "$want" '.assets[] | select(.name==$w) | .url')
            if [ -z "$url" ] || [ "$url" = "null" ]; then echo "no asset $want in $repo $tag"; continue; fi
            # same tag as last time, and the file is actually sitting in our release: nothing to do
            had=$(jq -r --arg r "$repo" '.[$r].version // ""' "$prev" 2>/dev/null || echo '')
            hadsz=$(jq -r --arg r "$repo" '.[$r].bytes // ""' "$prev" 2>/dev/null || echo '')
            live=$(gh release view apps-v1 --repo "$GITHUB_REPOSITORY" --json assets \
                     -q "[.assets[] | select(.name==\"$as\")] | length" 2>/dev/null || echo 0)
            if [ "$had" = "$tag" ] && [ -n "$had" ] && [ "$live" != "0" ]; then
              echo "$repo still on $tag -> $as unchanged, left alone (counter keeps running)"
              [ $first -eq 0 ] && echo ',' >> mirror.new
              first=0
              printf '  "%s": { "version": "%s", "asset": "%s", "bytes": %s }' "$repo" "$tag" "$as" "${hadsz:-0}" >> mirror.new
              continue
            fi
            curl -sL -H "Accept: application/octet-stream" -H "Authorization: Bearer $GH_TOKEN" "$url" -o "out/$as"
            sz=$(stat -c%s "out/$as")
            # a truncated download must never replace a good copy
            if [ "$sz" -lt 10000 ]; then echo "$as came back at $sz bytes - skipping"; rm -f "out/$as"; continue; fi
            echo "$repo $tag -> $as ($sz bytes)"
            [ $first -eq 0 ] && echo ',' >> mirror.new
            first=0
            printf '  "%s": { "version": "%s", "asset": "%s", "bytes": %s }' "$repo" "$tag" "$as" "$sz" >> mirror.new
          done <<'LIST'
          BeniaBot/subtitle-studio:SubtitleStudio.exe:SubtitleStudio.exe
          BeniaBot/tiknick:TikNick-Setup.exe:TikNick-Setup.exe
          BeniaBot/2049:2049_Setup.exe:2049_Setup.exe
          BeniaBot/Csharf:Csharf.bat:Csharf.bat
          BeniaBot/wolf-sheep-cabbage:WolfSheepCabbage.html:WolfSheepCabbage.html
          BeniaBot/eliza:ELIZA.exe:ELIZA.exe
          LIST
          printf '\n}\n' >> mirror.new
          mv mirror.new mirror.json
          cat mirror.json

      - name: Publish the copies into this project's release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(out/*)
          # "nothing fetched" is now the ordinary case - it means no in-house app has released
          # since the last run - so it must not stop the steps after this one.
          if [ ${#files[@]} -eq 0 ]; then echo "every copy is current - the release is left alone"; exit 0; fi
          gh release upload apps-v1 "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Tell the site the copies are there
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # published.json is how the page decides whether a download button is live. Adding the
          # files to the release without adding them here leaves four dead buttons - which is
          # exactly what happened the first time.
          gh release view apps-v1 --repo "$GITHUB_REPOSITORY" --json assets -q "[.assets[].name] | sort" > published.json
          # Both lists come straight from the release, so both hold every asset in it. The
          # catalogue does not show every asset; extras.json says which names these two files
          # leave out, and this puts that back after the regeneration undoes it.
          node .github/unlist.js published.json counts.json
          wc -c published.json counts.json

      - name: Record which build is being served
        run: |
          set -euo pipefail
          # git diff sees nothing in a file git has never tracked, so the first run always
          # reported "no change" and the record was never written at all
          git add mirror.json published.json counts.json
          if git diff --cached --quiet -- mirror.json published.json counts.json; then echo "no change"; exit 0; fi
          git config user.name  "mirror bot"
          git config user.email "noreply@github.com"
          git commit -m "The copies in the store's own release, refreshed"
          git push
